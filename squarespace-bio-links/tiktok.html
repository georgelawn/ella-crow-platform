<div id="ella-bio-links-tiktok"></div>
<style>
  #ella-bio-links-tiktok { --ink:#21150e; --paper:#f3e6b7; --gold:#e4cf87; --soft:#f8efcf; background:radial-gradient(circle at 50% -12%,rgba(255,255,255,.7),transparent 34%),linear-gradient(180deg,var(--gold),var(--paper)); border-radius:28px; box-shadow:0 18px 48px rgba(33,21,14,.24),0 3px 12px rgba(33,21,14,.18); box-sizing:border-box; color:var(--ink); font-family:Arial,Helvetica,sans-serif; margin:18px auto; max-width:980px; overflow:hidden; padding:42px 18px 32px; }
  #ella-bio-links-tiktok * { box-sizing:border-box; }
  #ella-bio-links-tiktok .ella-links-card { margin:0 auto; max-width:590px; text-align:center; }
  #ella-bio-links-tiktok .ella-links-avatar { border:3px solid var(--ink); border-radius:50%; display:block; height:108px; margin:0 auto 18px; object-fit:cover; object-position:50% 32%; width:108px; }
  #ella-bio-links-tiktok .ella-links-logo { display:block; height:auto; margin:0 auto 28px; max-width:390px; width:78%; }
  #ella-bio-links-tiktok .ella-links-list { display:grid; gap:13px; }
  #ella-bio-links-tiktok .ella-link,
  #ella-bio-links-tiktok .ella-music-toggle,
  #ella-bio-links-tiktok .ella-music-option { align-items:center; background:var(--soft); border:2px solid var(--ink); box-shadow:5px 5px 0 var(--ink); color:var(--ink); display:grid; font-size:.94rem; font-weight:800; grid-template-columns:44px 1fr 44px; letter-spacing:.045em; min-height:66px; padding:9px 10px; text-decoration:none; text-transform:uppercase; transition:transform 140ms ease,box-shadow 140ms ease,background 140ms ease; }
  #ella-bio-links-tiktok .ella-link:hover,#ella-bio-links-tiktok .ella-link:focus-visible { background:#fff7dc; box-shadow:2px 2px 0 var(--ink); transform:translate(3px,3px); }
  #ella-bio-links-tiktok .ella-link:hover,#ella-bio-links-tiktok .ella-link:focus-visible,#ella-bio-links-tiktok .ella-music-toggle:hover,#ella-bio-links-tiktok .ella-music-toggle:focus-visible,#ella-bio-links-tiktok .ella-music-option:hover,#ella-bio-links-tiktok .ella-music-option:focus-visible { background:#fff7dc; box-shadow:2px 2px 0 var(--ink); transform:translate(3px,3px); }
  #ella-bio-links-tiktok .ella-link-icon { align-items:center; border:1px solid rgba(33,21,14,.36); border-radius:50%; display:flex; font-family:Georgia,"Times New Roman",serif; font-size:.75rem; height:36px; justify-content:center; width:36px; }
  #ella-bio-links-tiktok .ella-link-icon img { height:19px; width:19px; }
  #ella-bio-links-tiktok .ella-link-icon .ella-live-badge { font-size:.64rem; letter-spacing:.08em; line-height:1; }
  #ella-bio-links-tiktok .ella-link-copy { display:block; }
  #ella-bio-links-tiktok .ella-link-copy small { color:var(--muted); display:block; font-size:.62rem; font-weight:800; letter-spacing:.14em; margin-top:2px; text-transform:uppercase; }
  #ella-bio-links-tiktok .ella-link-arrow { font-size:1.25rem; }
  #ella-bio-links-tiktok details.ella-music { display:block; }
  #ella-bio-links-tiktok details.ella-music > summary { list-style:none; }
  #ella-bio-links-tiktok details.ella-music > summary::-webkit-details-marker { display:none; }
  #ella-bio-links-tiktok .ella-music-panel { display:grid; gap:10px; margin-top:10px; padding:0 6px 2px; }
  #ella-bio-links-tiktok .ella-music-option { background:#fff7dc; min-height:58px; }
  #ella-bio-links-tiktok .ella-music-option span:last-child { font-size:1.1rem; }
  #ella-bio-links-tiktok .ella-music-option small { color:var(--muted); display:block; font-size:.62rem; font-weight:800; letter-spacing:.14em; margin-top:2px; text-transform:uppercase; }
  @media(max-width:520px){#ella-bio-links-tiktok{padding-top:30px}#ella-bio-links-tiktok .ella-link{box-shadow:4px 4px 0 var(--ink)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const root=document.querySelector("#ella-bio-links-tiktok"),platform="tiktok";
  const supabaseClient=window.supabase?window.supabase.createClient("https://hmwnkhgsocdevehebjpq.supabase.co","sb_publishable_5RLD78oK3TMo-SnPf1tljA_9d7-zuHn"):null;
  const destinations=[
    {label:"Join the community &#128038;",detail:"WhatsApp community",url:"https://chat.whatsapp.com/C6u02AqmrPZ31pv24JQSc1?s=cl&p=i&ilr=1",logo:"https://cdn.simpleicons.org/whatsapp/21150E",track:"WhatsApp Community"},
    {label:"Come and watch me live &#127908;",detail:"Tickets are here",url:"https://wegottickets.com/f/21926",icon:"LIVE",track:"Next Gig Tickets"},
    {label:"Listen to my unreleased music &#128144;",detail:"SoundCloud",url:"https://soundcloud.com/ellacrow",logo:"https://cdn.simpleicons.org/soundcloud/21150E",track:"SoundCloud"},
    {label:"Listen to my music &#11088;",detail:"Spotify and Apple Music",music:true,icon:"&#9835;",track:"Music menu"}
  ];
  const trackedUrl=raw=>{const url=new URL(raw);url.searchParams.set("utm_source",platform);url.searchParams.set("utm_medium","bio");return url.toString()};
  const record=(eventType,buttonName=null)=>supabaseClient?supabaseClient.from("bio_link_clicks").insert({platform,event_type:eventType,button_name:buttonName}):Promise.resolve();
  root.innerHTML=`<main class="ella-links-card"><img class="ella-links-avatar" src="https://images.squarespace-cdn.com/content/v1/691c7aea460cb8492f028449/27d985fe-0c41-4c52-98ed-e1488718fec3/Ella-Gig-2026-8_websize.jpeg?format=750w" alt="Ella Crow"><img class="ella-links-logo" src="https://georgelawn.github.io/ella-crow-platform/assets/ella-crow-logo.svg" alt="Ella Crow"><div class="ella-links-list"></div></main>`;
  const list=root.querySelector(".ella-links-list");
  function buildLink(destination){const link=document.createElement("a");link.className="ella-link";link.href=trackedUrl(destination.url);const icon=destination.logo?`<img src="${destination.logo}" alt="">`:destination.icon==="LIVE"?`<span class="ella-live-badge">LIVE</span>`:destination.icon;link.innerHTML=`<span class="ella-link-icon">${icon}</span><span class="ella-link-copy">${destination.label}<small>${destination.detail}</small></span><span class="ella-link-arrow">&rarr;</span>`;link.addEventListener("click",async event=>{event.preventDefault();const target=link.href;await Promise.race([record("click",destination.track),new Promise(resolve=>setTimeout(resolve,650))]);window.location.assign(target)});return link}
  function buildMusic(){const wrapper=document.createElement("details");wrapper.className="ella-music";const summary=document.createElement("summary");summary.className="ella-music-toggle";summary.innerHTML=`<span class="ella-link-icon">&#9835;</span><span class="ella-link-copy">Listen to my music &#11088;<small>Spotify and Apple Music</small></span><span class="ella-link-arrow">+</span>`;const panel=document.createElement("div");panel.className="ella-music-panel";[{label:"Spotify",detail:"Stream on Spotify",url:"https://open.spotify.com/album/5vCuP1VdJcAjyLkE6h8kFA?si=XlkpPGXXR0idG7v0B_PqlA",logo:"https://cdn.simpleicons.org/spotify/21150E"},{label:"Apple Music",detail:"Listen on Apple",url:"https://music.apple.com/gb/album/taking-shape/1840436179",logo:"https://cdn.simpleicons.org/applemusic/21150E"}].forEach(item=>{const link=document.createElement("a");link.className="ella-music-option";link.href=trackedUrl(item.url);const icon=item.logo?`<img src="${item.logo}" alt="">`:item.icon;link.innerHTML=`<span class="ella-link-icon">${icon}</span><span class="ella-link-copy">${item.label}<small>${item.detail}</small></span><span class="ella-link-arrow">&rarr;</span>`;link.addEventListener("click",async event=>{event.preventDefault();const target=link.href;await Promise.race([record("click",item.label),new Promise(resolve=>setTimeout(resolve,650))]);window.location.assign(target)});panel.append(link)});wrapper.append(summary,panel);summary.addEventListener("click",event=>{event.preventDefault();wrapper.open=!wrapper.open});return wrapper}
  destinations.forEach(destination=>{list.append(destination.music?buildMusic():buildLink(destination))});
  void Promise.resolve(record("view")).catch(()=>{});
})();
</script>
