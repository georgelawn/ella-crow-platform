<div style="width:100%;margin:0;padding:0;overflow:hidden;">
  <iframe
    id="ella-instagram-links"
    src="https://georgelawn.github.io/ella-crow-platform/squarespace-bio-links/instagram.html?v=20260729-hosted"
    title="Ella Crow Instagram links"
    scrolling="no"
    loading="eager"
    style="display:block;width:100%;height:900px;margin:0;border:0;background:transparent;overflow:hidden;"
  ></iframe>
</div>
<script>
(() => {
  const frame = document.getElementById("ella-instagram-links");
  if (!frame) return;
  window.addEventListener("message", (event) => {
    if (
      event.origin !== "https://georgelawn.github.io" ||
      event.source !== frame.contentWindow ||
      event.data?.type !== "ella-bio-links-height" ||
      event.data?.platform !== "instagram"
    ) return;
    const height = Number(event.data.height);
    if (Number.isFinite(height) && height > 0) frame.style.height = `${Math.ceil(height)}px`;
  });
})();
</script>
